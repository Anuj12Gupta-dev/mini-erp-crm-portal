name: Deploy

# Requires these repository secrets to be configured before this workflow can succeed:
#   EC2_HOST, EC2_USER, EC2_SSH_KEY        - SSH access to the backend EC2 instance
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   S3_BUCKET_NAME                          - frontend static site bucket
#   CLOUDFRONT_DISTRIBUTION_ID              - frontend CloudFront distribution
#   VITE_API_URL                            - the backend's public HTTPS URL, baked into the frontend build
# See README.md > Deploying to AWS for how to obtain each of these.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and redeploy the backend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mini-erp-crm-portal
            git pull origin main
            docker compose up -d --build server

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Build
        working-directory: client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Sync build to S3
        run: aws s3 sync client/dist "s3://${{ secrets.S3_BUCKET_NAME }}" --delete
      - name: Invalidate CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
