services:
  server:
    build: ./server
    env_file:
      - ./server/.env
    ports:
      - '4000:4000'
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    ports:
      - '8080:80'
    depends_on:
      - server
    restart: unless-stopped
